name: Deploy SampleFlow PWA to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build static PWA
        shell: bash
        run: |
          mkdir -p _site
          base64 -d app.html.gz.b64 | gzip -d > _site/index.html
          cp manifest.webmanifest sw.js icon.svg _site/
          touch _site/.nojekyll
          test -s _site/index.html
          grep -q 'SampleFlow' _site/index.html
          grep -q 'const SEED=' _site/index.html
          echo "index.html bytes: $(wc -c < _site/index.html)"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
