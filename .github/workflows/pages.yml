name: Deploy SampleFlow PWA to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Recover standard SampleFlow PWA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          SHARE='https://sampleflow-qvoenesdn-ganmiao9-7712s-projects.vercel.app/?_vercel_share=GyTbbN2XUb8TvWOLLH9ITjKzEsdigVi3'
          BASE='https://sampleflow-qvoenesdn-ganmiao9-7712s-projects.vercel.app/'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'

          # Open the temporary Vercel share link once to obtain its authorization cookie.
          curl --fail --location --compressed --cookie-jar cookies.txt --cookie cookies.txt \
            --retry 3 --retry-delay 2 -A "$UA" "$SHARE" -o first.html

          # Fetch the deployment again with the cookie. This is the real SampleFlow wrapper.
          curl --fail --location --compressed --cookie-jar cookies.txt --cookie cookies.txt \
            --retry 3 --retry-delay 2 -A "$UA" "$BASE" -o wrapper.html

          echo "wrapper bytes: $(wc -c < wrapper.html)"
          python - <<'PY'
          import base64, gzip, pathlib, re
          text=pathlib.Path('wrapper.html').read_text(encoding='utf-8')
          m=re.search(r"const b='([^']+)'", text)
          if not m:
              raise SystemExit('embedded app payload not found after Vercel share authorization')
          html=gzip.decompress(base64.b64decode(m.group(1))).decode('utf-8')
          if 'SampleFlow' not in html or 'const SEED=' not in html:
              raise SystemExit('recovered app failed integrity check')
          pathlib.Path('_site/index.html').write_text(html,encoding='utf-8')
          PY
          cp manifest.webmanifest sw.js icon.svg _site/
          touch _site/.nojekyll
          echo "index bytes: $(wc -c < _site/index.html)"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
